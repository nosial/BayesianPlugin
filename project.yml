source: src
default_build: release
update_source: nosial/bayesianplugin@n64
repository:
  name: n64
  type: github
  host: git.n64.cc
  ssl: true
assembly:
  name: BayesianPlugin
  package: net.nosial.bayesian_plugin
  version: 1.0.3
  url: 'https://github.com/nosial/BayesianPlugin'
  license: 'MIT'
  description: 'BayesianPlugin is a FederationLib plugin used to assist in scanning content using BayesianServer'
  author: 'Netkas <netkas@nosial.net>'
  organization: 'Nosial'
  product: 'Federation'
  copyright: 'Copyright (c) 2022-2026 Nosial'
dependencies:
  net.nosial.federation: nosial/federationlib@github
build_configurations:
  -
    name: debug
    output: 'target/debug/${ASSEMBLY.PACKAGE}.ncc'
    type: ncc
    definitions:
      NCC_DEBUG: true
    options:
      federationlib: &federationlib
        request_handlers:
          # Proxies BayesianServer's API for the root operator, eg; POST /bayesian/analytics to POST /analytics
          -
            path: /bayesian/*
            class: \BayesianPlugin\Handlers\BayesianProxyHandler::class
            request_method: GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, PUSH
        event_handlers:
          # Classifies the content of every content scan with BayesianServer
          -
            event: CONTENT_SCAN
            class: \BayesianPlugin\Handlers\ContentScanHandler::class
          # Trains BayesianServer with the text content of classified evidence
          -
            event: RECORD_CHANGE
            class: \BayesianPlugin\Handlers\EvidenceClassifiedHandler::class
            filter: EVIDENCE_CLASSIFIED
          # Makes BayesianServer forget the text content of deleted evidence
          -
            event: RECORD_CHANGE
            class: \BayesianPlugin\Handlers\EvidenceDeletedHandler::class
            filter: EVIDENCE_DELETED
  -
    name: release
    output: 'target/release/${ASSEMBLY.PACKAGE}.ncc'
    type: ncc
    options:
      federationlib: *federationlib
